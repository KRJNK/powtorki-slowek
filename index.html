<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Powtórki słówek — metoda pudełkowa</title>
<meta name="description" content="Fiszki angielsko-polskie metodą Leitnera: co umiesz, wraca rzadziej. 12 słówek na start, postęp zapisany lokalnie.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂</text></svg>">

<body>
<main>
  <!-- TODO: link do portfolio, gdy powstanie -->
  <h1>Powtórki słówek</h1>
  <p>Metoda pudełkowa: trafione słówka wracają rzadziej.</p>
  <section class="card">
    <div class="progress"><div id="bar" style="width:0%"></div></div>
    <p class="hint" id="prog"></p>
    <div id="card" class="big"></div>
    <p id="answer" class="hint"></p>
    <button id="show" type="button">Pokaż odpowiedź</button>
    <span id="grade" hidden>
      <button id="know" type="button">Wiem ✓</button>
      <button id="dont" type="button">Nie wiem ✗</button>
    </span>
    <p><button id="reset" type="button">Zacznij od nowa</button></p>
  </section>
  <div id="ads-slot" hidden></div>
  <footer><a href="privacy.html">Prywatność</a> · <a href="kontakt.html">Kontakt</a></footer>

<script src="app.js"></script>
<script src="ads.js"></script>
